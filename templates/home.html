{% extends "base.html" %}
{% load static %}

{% block content %}

<section class="section-intro padding-y-sm">
    <div class="container">
        
        <div id="homeBanner" class="carousel slide intro-banner-wrap shadow-sm mb-4" data-ride="carousel">
            
            <ol class="carousel-indicators">
                <li data-target="#homeBanner" data-slide-to="0" class="active"></li>
                <li data-target="#homeBanner" data-slide-to="1"></li>
                <li data-target="#homeBanner" data-slide-to="2"></li>
                <li data-target="#homeBanner" data-slide-to="3"></li>
            </ol>

            <div class="carousel-inner rounded">
                <div class="carousel-item active">
                    <img src="{% static 'images/banners/Gemini_Generated_Image_44yfci44yfci44yf.png' %}" class="d-block w-100" alt="First slide" style="height: 400px; object-fit: cover;">
                </div>

                <div class="carousel-item">
                    <img src="{% static 'images/banners/Gemini_Generated_Image_h4uhw4h4uhw4h4uh.png' %}" class="d-block w-100" alt="Second slide" style="height: 400px; object-fit: cover;">
                </div>

                <div class="carousel-item">
                    <img src="{% static 'images/banners/Gemini_Generated_Image_kl9kyhkl9kyhkl9k.png' %}" class="d-block w-100" alt="Third slide" style="height: 400px; object-fit: cover;">
                </div>

                <div class="carousel-item">
                    <img src="{% static 'images/banners/Gemini_Generated_Image_xjzkxyxjzkxyxjzk.png' %}" class="d-block w-100" alt="Fourth slide" style="height: 400px; object-fit: cover;">
                </div>
            </div>

            <a class="carousel-control-prev" href="#homeBanner" role="button" data-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="sr-only">Previous</span>
            </a>
            <a class="carousel-control-next" href="#homeBanner" role="button" data-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="sr-only">Next</span>
            </a>
        </div>
    </div>
</section>

<section class="section-name padding-y-sm">
    <div class="container">
        
        <header class="section-heading mb-4">
            <a href="{% url 'store' %}" class="btn btn-outline-primary float-right">See all</a>
            <h3 class="section-title">Popular products</h3>
        </header>

        <div class="row">
            {% for product in products %}
            <div class="col-md-3 col-sm-6 mb-4">
                <div class="card card-product-grid shadow-sm h-100 border-0">
                    
                    <a href="{{ product.get_url}}" class="img-wrap" style="height: 220px; padding: 20px;"> 
                        <img src="{{ product.images.url }}" alt="{{ product.product_name }}" style="width: 100%; height: 100%; object-fit: contain;"> 
                    </a>
                    
                    <figcaption class="info-wrap border-top">
                        <a href="{{ product.get_url }}" class="title text-truncate d-block text-dark font-weight-bold">{{ product.product_name }}</a>
                        <div class="price mt-2 text-primary font-weight-bold"> $ {{ product.price }}</div> 
                    </figcaption>

                </div>
            </div> 
            {% endfor %}
        </div> 

    </div>
</section>

{% endblock content %}
